# Everything the runner needs is pinned here so one file describes one experiment.
#
# Freeze this file in week 1: the split seed, the budget and the model are part of
# the experimental design, not tuning knobs.

budget:
  # Per task: at most this many tool calls and this much wall-clock time.
  max_tool_calls: 50
  timeout_s: 900

split:
  # 40% of the adopted tasks go to development, 60% to test.
  dev_fraction: 0.4
  seed: 20260601

model:
  # Any OpenAI-compatible chat endpoint. The GUI interface needs vision=true.
  base_url: "http://127.0.0.1:3425/v1"
  model: "auto/deepseek-v4.1-flash"
  api_key_env: "OPENAI_API_KEY"
  vision: true
  # How many screenshots stay attached in the prompt; older ones are folded to text.
  image_history: 2
  temperature: 0.0
  max_tokens: 4096
  timeout_s: 180

harness:
  # The CLI-Anything binaries the harness interface may call.
  libreoffice: "cli-anything-libreoffice"
  gimp: "cli-anything-gimp"
  skill_docs: {}

gui:
  # Windows-MCP over stdio. It needs Python 3.14, so uvx fetches that interpreter.
  command: ["uvx", "--python", "3.14", "--from", "windows-mcp", "windows-mcp", "serve", "--transport", "stdio"]
  tools:
    - Screenshot
    - Snapshot
    - Click
    - Type
    - Scroll
    - Move
    - Shortcut
    - Wait
    - WaitFor
  start_timeout_s: 60
  idle_gate_s: 10

owncli:
  # Our own CLI-Anything harness, on our own tasks: same agent, same budget.
  binary: "cli-anything-nizigen-blog"
  # A minimal Hugo site is generated per run unless a template directory is given.
  template: ""
  hugo: "C:/Coding/tools/hugo/0.168.0/hugo.exe"
  # Private config directory, so a run cannot touch the real blog repositories.
  home: ""

apps:
  # A project-local, unpacked LibreOffice (tools/), not a system install. Leave
  # empty to let the runner look on PATH and in Program Files.
  soffice: "tools/libreoffice/program/soffice.com"
  gimp: ""

repeats:
  # Harness, script and owncli run three times; GUI and hybrid occupy the
  # desktop, so they run once and the asymmetry is reported.
  harness: 3
  script: 3
  gui: 1
  hybrid: 1
  owncli: 3

runs_dir: "runs"
download_cache: ".cache/osworld"
